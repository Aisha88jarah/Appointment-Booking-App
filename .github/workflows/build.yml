name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner already ships the Android SDK. android-actions/setup-android@v3 failed here because
      # sdkmanager no longer has the legacy 'tools' package, so only accept the SDK licenses.
      - name: Accept Android SDK licenses
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$sdkmanager_bin" ]; then
            yes | "$sdkmanager_bin" --licenses > /dev/null || true
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Gradle wrapper (generated if the JAR is not committed)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            tmp="$(mktemp -d)"
            touch "$tmp/settings.gradle"   # Gradle 8.9 refuses to run in a directory without a build
            (cd "$tmp" && gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon)
            mkdir -p gradle/wrapper
            cp "$tmp/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
            cp "$tmp/gradlew" "$tmp/gradlew.bat" .
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
